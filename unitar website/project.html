<style>
:root{
  --void:#050a0d;--void-2:#081018;--abyss:#0c1922;--panel:#0e1c26;
  --glass-border:rgba(170,224,224,.14);--glass-border-strong:rgba(170,224,224,.28);
  --bio-green:#6dffc1;--bio-cyan:#52e0ff;--dusk-purple:#9084e6;
  --ink-100:#f2f9f7;--ink-300:#b9cdcb;--ink-500:#7f948f;--ink-700:#445350;

  --accent:#6dffc1;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--void);color:var(--ink-100);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
::selection{background:var(--accent);color:#04120c;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}
.grain{position:fixed;inset:0;pointer-events:none;z-index:200;opacity:.05;mix-blend-mode:overlay;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.6) 0px,rgba(255,255,255,.6) 1px,transparent 1px,transparent 3px);}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:clamp(1.25rem,5vw,2.5rem);}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;}
.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:.6em;}
.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px 2px color-mix(in srgb,var(--accent) 70%,transparent);flex-shrink:0;}
.section{padding-block:clamp(3.5rem,7vw,6rem);}

/* NAV */
.nav{position:fixed;top:1.1rem;left:50%;transform:translateX(-50%);width:min(calc(100% - 2rem),1080px);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:.55rem .6rem .55rem 1.3rem;border-radius:999px;background:rgba(8,16,20,.55);border:1px solid var(--glass-border);backdrop-filter:blur(18px) saturate(140%);}
.logo{display:flex;align-items:center;gap:.6em;font-family:var(--font-display);font-weight:700;font-size:1rem;}
.logo-mark{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#eafff4,var(--bio-green) 45%,transparent 75%);box-shadow:0 0 14px 3px rgba(109,255,193,.65);}
.nav-actions{display:flex;align-items:center;gap:.7rem;}
.nav-back{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.06em;color:var(--ink-500);display:flex;align-items:center;gap:.4em;transition:color .2s;}
.nav-back:hover{color:var(--ink-100);}
.btn{font-family:var(--font-mono);font-size:.8rem;letter-spacing:.04em;font-weight:500;display:inline-flex;align-items:center;gap:.5em;padding:.75em 1.4em;border-radius:999px;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap;border:none;}
.btn-primary{background:radial-gradient(circle at 32% 22%,#d4ffec,var(--bio-green) 45%,#35d99b 100%);color:#04140d;box-shadow:0 0 0 1px rgba(109,255,193,.4),0 8px 24px -6px rgba(109,255,193,.5),inset 0 1px 0 rgba(255,255,255,.6);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(109,255,193,.6),0 12px 30px -6px rgba(109,255,193,.7);}
.btn-ghost{background:rgba(170,224,224,.05);border:1px solid var(--glass-border);color:var(--ink-100);}
.btn-ghost:hover{background:rgba(170,224,224,.1);transform:translateY(-2px);}
.btn-accent{color:#04140d;box-shadow:0 0 0 1px rgba(109,255,193,.4),0 8px 24px -6px color-mix(in srgb,var(--accent) 40%,transparent);}

/* HERO */
.hero{padding-top:8rem;padding-bottom:4rem;position:relative;overflow:hidden;min-height:56vh;display:flex;align-items:center;}
.hero-bg{position:absolute;inset:0;z-index:0;}
.hero-bg img{width:100%;height:100%;object-fit:cover;opacity:.18;filter:saturate(60%);}
.hero-bg-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,13,.4) 0%,var(--void) 90%);}
.hero-bg-glow{position:absolute;inset:0;background:radial-gradient(ellipse 800px 500px at 50% 50%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 65%);}
.hero-content{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center;}
@media(max-width:760px){.hero-content{grid-template-columns:1fr;}}
.hero-badges{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.2rem;}
.badge{font-family:var(--font-mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;padding:.3em .8em;border-radius:999px;display:inline-flex;align-items:center;gap:.4em;}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;}
.badge-cat{background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent);}
.badge-cat::before{background:var(--accent);box-shadow:0 0 6px var(--accent);}
.badge-live{background:rgba(109,255,193,.06);border:1px solid rgba(109,255,193,.3);color:rgba(109,255,193,.9);}
.badge-live::before{background:#6dffc1;box-shadow:0 0 5px #6dffc1;}
.badge-wip{background:rgba(129,140,248,.06);border:1px solid rgba(129,140,248,.3);color:rgba(129,140,248,.9);}
.badge-wip::before{background:#818CF8;}
.badge-github{background:rgba(100,116,139,.06);border:1px solid rgba(100,116,139,.3);color:rgba(100,116,139,.9);}
.badge-github::before{background:#64748B;}
.badge-deploy{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.3);color:rgba(245,158,11,.9);}
.badge-deploy::before{background:#F59E0B;}
.badge-client{background:rgba(215,255,94,.08);border:1px solid rgba(215,255,94,.25);color:rgba(215,255,94,.9);}
.badge-client::before{background:#d7ff5e;box-shadow:0 0 5px #d7ff5e;}
.hero-title{font-size:clamp(2.2rem,5vw,4rem);line-height:1.04;margin-bottom:.7rem;}
.hero-title span{color:var(--accent);}
.hero-tagline{color:var(--ink-300);font-size:1.05rem;max-width:48ch;margin-bottom:2rem;}
.hero-actions{display:flex;gap:.8rem;flex-wrap:wrap;}
.hero-aside{text-align:right;}
@media(max-width:760px){.hero-aside{display:none;}}

/* HOW IT WORKS */
.how-section{border-top:1px solid var(--glass-border);background:linear-gradient(180deg,var(--void-2),var(--void));}
.flow-wrap{margin-top:2.4rem;overflow-x:auto;padding-bottom:.5rem;}
.flow-svg{min-width:600px;width:100%;}
.steps-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.1rem;margin-top:2.2rem;}
.step-card{padding:1.2rem 1.4rem;border-radius:14px;background:rgba(14,28,38,.7);border:1px solid var(--glass-border);border-left:2px solid var(--accent);}
.step-card .step-num{font-family:var(--font-mono);font-size:.65rem;color:var(--accent);letter-spacing:.14em;margin-bottom:.4rem;}
.step-card h4{font-family:var(--font-display);font-size:.88rem;margin-bottom:.35rem;}
.step-card p{color:var(--ink-500);font-size:.82rem;line-height:1.5;}

/* FEATURES */
.features-section{border-top:1px solid var(--glass-border);}
.features-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;margin-top:2.2rem;}
.feat-card{padding:1.5rem 1.6rem;border-radius:16px;background:linear-gradient(145deg,rgba(14,28,38,.8),rgba(8,16,24,.9));border:1px solid var(--glass-border);transition:border-color .25s,transform .25s;}
.feat-card:hover{border-color:var(--glass-border-strong);transform:translateY(-3px);}
.feat-card::before{content:'';display:block;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px 2px color-mix(in srgb,var(--accent) 50%,transparent);margin-bottom:1rem;}
.feat-card h4{font-family:var(--font-display);font-size:.9rem;margin-bottom:.45rem;}
.feat-card p{color:var(--ink-300);font-size:.82rem;line-height:1.5;}

/* SCREENSHOTS */
.screens-section{border-top:1px solid var(--glass-border);}
.screens-track{display:flex;gap:1rem;overflow-x:auto;padding-bottom:1rem;scroll-snap-type:x mandatory;margin-top:2rem;}
.screens-track::-webkit-scrollbar{height:4px;}
.screens-track::-webkit-scrollbar-track{background:rgba(170,224,224,.05);}
.screens-track::-webkit-scrollbar-thumb{background:rgba(109,255,193,.3);border-radius:999px;}
.screen-item{flex-shrink:0;scroll-snap-align:start;border-radius:12px;overflow:hidden;border:1px solid var(--glass-border);position:relative;}
.screen-item img{height:300px;width:auto;display:block;}
.screen-label{position:absolute;bottom:.6rem;left:.7rem;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(242,249,247,.7);background:rgba(0,0,0,.55);padding:.25em .6em;border-radius:4px;}

/* PLACEHOLDER HERO */
.hero-ph{width:280px;height:200px;border-radius:16px;overflow:hidden;border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.6rem;opacity:.22;color:var(--ink-100);}

/* TECH STACK */
.tech-section{border-top:1px solid var(--glass-border);}
.tech-pills{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.8rem;}

.tech-pill::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.7;}

/* NAV STRIP */
.proj-nav{border-top:1px solid var(--glass-border);padding-block:2rem;}
.proj-nav .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;}
.pnav-link{display:flex;flex-direction:column;gap:.3rem;font-family:var(--font-mono);}
.pnav-link .dir{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-500);}
.pnav-link .pname{font-family:var(--font-display);font-size:1rem;color:var(--ink-100);transition:color .2s;}
.pnav-link:hover .pname{color:var(--accent);}

/* SECTION HEADS */
.sec-head{margin-bottom:.4rem;}
.sec-head h2{font-size:clamp(1.5rem,3vw,2.2rem);margin-top:.8rem;}
.sec-head p{color:var(--ink-300);margin-top:.8rem;max-width:58ch;}

/* CTA */
.cta-strip{padding-block:3.5rem;border-top:1px solid var(--glass-border);background:radial-gradient(ellipse 600px 300px at 50% 100%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 65%);}

.cta-strip h3{font-size:clamp(1.3rem,2.4vw,1.8rem);}
.cta-strip p{color:var(--ink-300);font-size:.95rem;max-width:46ch;}

/* 404 */
.four04{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.2rem;padding-top:6rem;}
.four04 h1{font-size:2.4rem;}
.four04 p{color:var(--ink-300);}

footer{border-top:1px solid var(--glass-border);padding-block:2rem;}
footer .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.footer-fine{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-700);}

.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease;}
.reveal.vis{opacity:1;transform:none;}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}
</style>

/* ============================================================
   ORDERED LIST for prev/next navigation
   ============================================================ */
const ORDER = ['boeme','celestos','cosmofic','vidblade','infinitemix','lyricvideomaker','autoblogai','siteclonepro','prediction','openworld','proceduralworld','citysimvisualizer','terrainmaker','interactiveadventure','mesmeraudiovisual','binauralmixer','artisticqr','keyofsong','planetaryhours','midify','cartoonify','plushymaker','worldwondermaker','dogpetportrait','catpetportrait','imgto3d','bulkimagecreator','bulkaudioquality','texttranslator','gifcityscraper','dimensio','seatravel','youtubedigest','lostalgia','faero','whereshouldilive','porucisajt','prevodilacsrpski','stadajedem','everythingaboutjapan','srpskajela','decordomadobro'];

/* ============================================================
   CATEGORY ACCENT MAP
   ============================================================ */
const CAT_ACCENT = {Flagship:'#6dffc1',Games:'#9084e6',Creative:'#ff5fa2',Tools:'#52e0ff',Websites:'#d7ff5e',Clients:'#d7ff5e'};

/* ============================================================
   FLOW DIAGRAM RENDERER
   ============================================================ */
function drawFlow(steps, accent='#6dffc1') {
  const nodeW = 140, nodeH = 58, gap = 18, arrLen = 28;
  const totalW = steps.length * nodeW + (steps.length - 1) * (gap + arrLen);
  const W = Math.max(1000, totalW + 60);
  const sx = (W - totalW) / 2;
  const cy = 58;
  let svg = '';
  // Glow def
  svg += `<defs><filter id="glo"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  steps.forEach((s,i)=>{
    const x = sx + i*(nodeW+gap+arrLen);
    // Box
    svg+=`<rect x="${x}" y="${cy-nodeH/2}" width="${nodeW}" height="${nodeH}" rx="10" fill="rgba(12,25,34,0.92)" stroke="${accent}" stroke-opacity="0.45" stroke-width="1"/>`;
    // Label
    svg+=`<text x="${x+nodeW/2}" y="${cy-6}" text-anchor="middle" fill="${accent}" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600" letter-spacing="0.05em">${s.label}</text>`;
    // Detail
    if(s.detail)svg+=`<text x="${x+nodeW/2}" y="${cy+12}" text-anchor="middle" fill="rgba(185,205,203,0.65)" font-family="'Inter',sans-serif" font-size="9.5">${s.detail}</text>`;
    // Arrow
    if(i<steps.length-1){
      const ax=x+nodeW+2, ay=cy;
      svg+=`<line x1="${ax}" y1="${ay}" x2="${ax+gap+arrLen-6}" y2="${ay}" stroke="${accent}" stroke-opacity="0.55" stroke-width="1.4"/>`;
      svg+=`<polygon points="${ax+gap+arrLen-6},${ay-4} ${ax+gap+arrLen+4},${ay} ${ax+gap+arrLen-6},${ay+4}" fill="${accent}" opacity="0.55"/>`;
    }
  });
  return `<svg class="flow-svg" viewBox="0 0 ${W} ${cy*2}" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;
}

/* ============================================================
   STATUS BADGE HTML
   ============================================================ */
function statusBadge(status){
  const map={live:'badge-live',wip:'badge-wip',github:'badge-github',deploy:'badge-deploy'};
  const label={live:'Live',wip:'In Progress',github:'Open Source',deploy:'Backend Needed'};
  return `<span class="badge ${map[status]||'badge-wip'}">${label[status]||status}</span>`;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(slug){
  const p = PROJECTS[slug];
  const root = document.getElementById('root');
  if(!p){
    root.innerHTML=`<div class="four04"><h1>Project not found.</h1><p><a href="index.html" style="color:var(--bio-green)">← Back to the portfolio</a></p></div>`;
    return;
  }
  const accent = p.accent || CAT_ACCENT[p.cat] || '#6dffc1';
  // Update CSS accent var
  document.documentElement.style.setProperty('--accent', accent);
  document.title = `${p.name} — UNITAR`;

  // Nav live button
  const navBtn = document.getElementById('navLiveBtn');
  if(p.liveUrl && p.status!=='github'){
    navBtn.href = p.liveUrl;
    navBtn.style.display='flex';
    navBtn.style.background=`radial-gradient(circle at 32% 22%,#fff,${accent} 45%)`;
  } else if(p.liveUrl && p.status==='github'){
    navBtn.href=p.liveUrl;
    navBtn.textContent='View repo ↗';
    navBtn.style.display='flex';
    navBtn.className='btn btn-ghost';
  } else {
    navBtn.style.display='none';
  }

  // Prev / next
  const idx=ORDER.indexOf(slug);
  const prev=idx>0?ORDER[idx-1]:null;
  const next=idx<ORDER.length-1?ORDER[idx+1]:null;
  const prevP=prev&&PROJECTS[prev];
  const nextP=next&&PROJECTS[next];

  // Hero screenshot
  const heroShot = p.screenshots && p.screenshots[0] ? `screenshots/${p.screenshots[0]}` : '';

  // Screenshots gallery
  const galleryItems = (p.screenshots||[]).map((s,i)=>{
    const labels=['Landing page','Destinations','Visas','Costs','Tips','Hidden gems','Videos','Main view','Detail view','Results'];
    return `<div class="screen-item"><img src="screenshots/${s}" alt="${p.name} screenshot ${i+1}" loading="lazy"><span class="screen-label">${labels[i]||`View ${i+1}`}</span></div>`;
  }).join('');

  // Features
  const featCards = (p.features||[]).map(f=>
    `<div class="feat-card"><h4>${f.name}</h4><p>${f.detail}</p></div>`
  ).join('');

  // Tech pills
  const techPills = (p.tech||[]).map(t=>`<span class="tech-pill">${t}</span>`).join('');

  // Flow diagram
  const flowSVG = drawFlow(p.flow||[], accent);

  root.innerHTML = `
  <!-- HERO -->
  <section class="hero section">
    <div class="hero-bg">
      ${heroShot?`<img src="${heroShot}" alt="${p.name}" aria-hidden="true">`:''}
      <div class="hero-bg-grad"></div>
      <div class="hero-bg-glow"></div>
    </div>
    <div class="wrap hero-content">
      <div>
        <div class="hero-badges">
          <span class="badge badge-cat">${p.cat}</span>
          ${statusBadge(p.status)}
          ${p.clientWork?'<span class="badge badge-client">Foreign Client ✓</span>':''}
        </div>
        <h1 class="hero-title">${p.name}</h1>
        <p class="hero-tagline">${p.tagline}</p>
        <div class="hero-actions">
          ${p.liveUrl&&p.status!=='github'?`<a href="${p.liveUrl}" target="_blank" rel="noopener" class="btn btn-primary" style="background:radial-gradient(circle at 32% 22%,#fff,${accent} 45%);color:#04140d">Open live project ↗</a>`:''}
          ${p.liveUrl&&p.status==='github'?`<a href="${p.liveUrl}" target="_blank" rel="noopener" class="btn btn-ghost">View on GitHub ↗</a>`:''}
          <a href="index.html#projects" class="btn btn-ghost">← All projects</a>
        </div>
      </div>
      ${heroShot?`<div class="hero-aside"><img src="${heroShot}" alt="${p.name}" style="width:340px;height:220px;object-fit:cover;border-radius:16px;border:1px solid rgba(170,224,224,.18);box-shadow:0 0 40px -10px color-mix(in srgb,${accent} 30%,transparent);" loading="eager"></div>`:`<div class="hero-ph" style="width:280px;height:200px;border-radius:16px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,${accent} 30%,transparent),transparent 70%),linear-gradient(140deg,#071a12,#061018);border:1px solid rgba(170,224,224,.14);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.6rem;opacity:.22;color:var(--ink-100);">${p.name[0]}</div>`}
    </div>
  </section>

  <!-- ABOUT -->
  <section class="section" style="border-top:1px solid var(--glass-border);">
    <div class="wrap">
      <div class="sec-head reveal">
        <span class="eyebrow">About</span>
        <h2>${p.name}</h2>
        <p style="font-size:1.02rem;line-height:1.7;max-width:68ch;">${p.desc}</p>
      </div>
    </div>
  </section>

  <!-- HOW IT WORKS -->
  <section class="section how-section">
    <div class="wrap">
      <div class="sec-head reveal">
        <span class="eyebrow">How it works</span>
        <h2>The architecture</h2>
      </div>
      <div class="flow-wrap reveal">${flowSVG}</div>
      <div class="steps-list">
        ${(p.flow||[]).map((s,i)=>`
          <div class="step-card reveal">
            <div class="step-num">0${i+1}</div>
            <h4>${s.label}</h4>
            <p>${s.detail}</p>
          </div>`).join('')}
      </div>
    </div>
  </section>

  <!-- FEATURES -->
  ${featCards?`<section class="section features-section">
    <div class="wrap">
      <div class="sec-head reveal">
        <span class="eyebrow">What it does</span>
        <h2>Core capabilities</h2>
      </div>
      <div class="features-grid">${featCards}</div>
    </div>
  </section>`:''}

  <!-- SCREENSHOTS -->
  ${galleryItems?`<section class="section screens-section">
    <div class="wrap">
      <div class="sec-head reveal">
        <span class="eyebrow">Screenshots</span>
        <h2>In the wild</h2>
      </div>
    </div>
    <div class="wrap"><div class="screens-track">${galleryItems}</div></div>
  </section>`:''}

  <!-- VIDEO / DEMO -->
  ${(p.youtubeExamples||p.livePerformance||p.youtubeDemo||p.driveDemo)?`<section class="section" style="border-top:1px solid var(--glass-border);">
    <div class="wrap">
      <div class="sec-head reveal">
        <span class="eyebrow">${p.youtubeExamples?'Output examples':p.livePerformance?'Live performance':p.driveDemo?'Demo':'See it in action'}</span>
        <h2>${p.youtubeExamples?'Made with InfiniteMix':p.livePerformance?'Live at full power':p.driveDemo?'See the effect in action':'In action'}</h2>
        <p style="color:var(--ink-300);margin-top:.6rem;">${p.livePerformance?'A live audio-visual performance — the tool running in real time.':p.driveDemo?'Cinematic parallax depth — subjects float, backgrounds recede. Watch the full demo.':'Watch the full demo below.'}</p>
      </div>
      ${p.youtubeExamples?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;margin-top:2rem;">${(p.youtubeExamples).map(v=>`<a href="https://youtu.be/${v.id}" target="_blank" rel="noopener" style="display:block;border-radius:14px;overflow:hidden;border:1px solid var(--glass-border);transition:transform .25s,border-color .25s;text-decoration:none;" onmouseover="this.style.transform='translateY(-3px)';this.style.borderColor='rgba(170,224,224,.4)'" onmouseout="this.style.transform='';this.style.borderColor='var(--glass-border)'"><img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="${v.label}" style="width:100%;display:block;aspect-ratio:16/9;object-fit:cover;"><div style="padding:.75rem 1rem;background:rgba(14,28,38,.85);"><span style="font-family:var(--font-mono);font-size:.72rem;color:var(--ink-300);letter-spacing:.04em;">${v.label}</span></div></a>`).join('')}</div>`:''}
      ${(p.livePerformance||p.youtubeDemo)?`<div style="margin-top:2rem;border-radius:16px;overflow:hidden;border:1px solid var(--glass-border);aspect-ratio:16/9;position:relative;"><iframe style="width:100%;height:100%;position:absolute;inset:0;border:none;" src="https://www.youtube.com/embed/${(p.livePerformance||p.youtubeDemo).replace(/.*(?:youtu\.be\/|v=)([^&]+).*/,'$1')}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`:''}
      ${p.driveDemo?`<div style="margin-top:2rem;border-radius:16px;overflow:hidden;border:1px solid var(--glass-border);aspect-ratio:16/9;position:relative;box-shadow:0 0 40px -10px rgba(82,224,255,.2);"><iframe style="width:100%;height:100%;position:absolute;inset:0;border:none;" src="${p.driveDemo}" allow="autoplay" allowfullscreen loading="lazy"></iframe></div>`:''}
    </div>
  </section>`:''}

  <!-- TECH -->
  ${techPills?`<section class="section tech-section">
    <div class="wrap">
      <div class="sec-head reveal">
        <span class="eyebrow">Built with</span>
        <h2>Tech stack</h2>
      </div>
      <div class="tech-pills">${techPills}</div>
    </div>
  </section>`:''}

  <!-- CTA -->
  <section class="cta-strip">
    <div class="wrap">
      <div>
        <h3>Want something like this built?</h3>
        <p>Bring the idea. We'll figure out the rest.</p>
      </div>
      <a href="mailto:contact@unitar.app" class="btn btn-primary" style="background:radial-gradient(circle at 32% 22%,#fff,${accent} 45%);color:#04140d;">Get in touch →</a>
    </div>
  </section>

  <!-- PREV / NEXT -->
  <nav class="proj-nav">
    <div class="wrap">
      ${prevP?`<a href="project.html#${prev}" class="pnav-link" onclick="navigate(event,'${prev}')"><span class="dir">← Previous</span><span class="pname">${prevP.name}</span></a>`:'<div></div>'}
      <a href="index.html#projects" class="btn btn-ghost">All projects</a>
      ${nextP?`<a href="project.html#${next}" class="pnav-link" style="text-align:right" onclick="navigate(event,'${next}')"><span class="dir">Next →</span><span class="pname">${nextP.name}</span></a>`:'<div></div>'}
    </div>
  </nav>
  `;

  // Scroll to top
  window.scrollTo({top:0,behavior:'instant'});

  // Reveal observer
  const els = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target);}});
  },{threshold:.1});
  els.forEach(el=>io.observe(el));
}

function navigate(e,slug){
  e.preventDefault();
  window.location.hash=slug;
}

function init(){
  const slug = window.location.hash.slice(1);
  if(slug&&PROJECTS[slug]) render(slug);
  else if(slug&&!PROJECTS[slug]){
    document.getElementById('root').innerHTML=`<div class="four04"><h1>Project not found.</h1><p>Slug "<code>${slug}</code>" doesn't match any project.<br><a href="index.html#projects" style="color:var(--bio-green)">← Back to all projects</a></p></div>`;
  } else {
    window.location.href='index.html#projects';
  }
}

window.addEventListener('hashchange',()=>render(window.location.hash.slice(1)));
init();
</script>
</body>
</html>
