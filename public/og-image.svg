<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter for sphere -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Subtle pattern overlay -->
  <g opacity="0.05">
    <rect x="0" y="0" width="60" height="60" fill="white" opacity="0.5"/>
    <rect x="120" y="0" width="60" height="60" fill="white" opacity="0.5"/>
    <rect x="240" y="0" width="60" height="60" fill="white" opacity="0.5"/>
    <rect x="60" y="60" width="60" height="60" fill="white" opacity="0.5"/>
    <rect x="180" y="60" width="60" height="60" fill="white" opacity="0.5"/>
  </g>

  <!-- Animated Sphere Logo (Left) -->
  <g transform="translate(200, 315) scale(1.8)" filter="url(#glow)">
    <g transform="rotate(135)">
      <ellipse cx="0" cy="-40" rx="15" ry="4" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.5"/>
      <ellipse cx="0" cy="-30" rx="25" ry="5" stroke="#60a5fa" stroke-width="2.2" fill="none" opacity="0.6"/>
      <ellipse cx="0" cy="-20" rx="35" ry="7" stroke="#60a5fa" stroke-width="2.5" fill="none" opacity="0.7"/>
      <ellipse cx="0" cy="-10" rx="43" ry="9" stroke="#3b82f6" stroke-width="2.8" fill="none" opacity="0.8"/>
      <ellipse cx="0" cy="0" rx="50" ry="12" stroke="#60a5fa" stroke-width="3.5" fill="none" opacity="1"/>
      <ellipse cx="0" cy="10" rx="43" ry="9" stroke="#3b82f6" stroke-width="2.8" fill="none" opacity="0.8"/>
      <ellipse cx="0" cy="20" rx="35" ry="7" stroke="#60a5fa" stroke-width="2.5" fill="none" opacity="0.7"/>
      <ellipse cx="0" cy="30" rx="25" ry="5" stroke="#60a5fa" stroke-width="2.2" fill="none" opacity="0.6"/>
      <ellipse cx="0" cy="40" rx="15" ry="4" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.5"/>
    </g>
  </g>

  <!-- Content (Right Side) -->
  <g transform="translate(450, 0)">
    <!-- Main Title -->
    <text x="0" y="200" font-family="Montserrat, Arial, sans-serif" font-size="72" font-weight="900" fill="white">
      UNITAR
    </text>
    <text x="0" y="260" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="700" fill="white" opacity="0.95">
      AI Innovations
    </text>

    <!-- Tagline -->
    <text x="0" y="330" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="600" fill="white" opacity="0.9">
      Entertainment &amp; Creative AI Specialists
    </text>

    <!-- Stats Row -->
    <g transform="translate(0, 390)">
      <!-- Stat 1 -->
      <g>
        <text x="0" y="0" font-family="Montserrat, Arial, sans-serif" font-size="48" font-weight="900" fill="#60a5fa">15+</text>
        <text x="0" y="35" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" fill="white" opacity="0.85">Production Apps</text>
      </g>

      <!-- Stat 2 -->
      <g transform="translate(220, 0)">
        <text x="0" y="0" font-family="Montserrat, Arial, sans-serif" font-size="48" font-weight="900" fill="#60a5fa">500K+</text>
        <text x="0" y="35" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" fill="white" opacity="0.85">Active Users</text>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(470, 0)">
        <text x="0" y="0" font-family="Montserrat, Arial, sans-serif" font-size="48" font-weight="900" fill="#60a5fa">Top 10</text>
        <text x="0" y="35" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" fill="white" opacity="0.85">App Store</text>
      </g>
    </g>

    <!-- Bottom text -->
    <text x="0" y="530" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="500" fill="white" opacity="0.7">
      Music AI • Video AI • Creative Tools
    </text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="white" opacity="0.1"/>
</svg>
